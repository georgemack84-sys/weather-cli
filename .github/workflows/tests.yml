name: Weather CLI CI

on:
  push:
    branches:
      - main

  pull_request:
    branches:
      - main


jobs:
  test:
    name: Python ${{ matrix.python-version }}
    runs-on: ubuntu-latest

    strategy:
      fail-fast: false
      matrix:
        python-version:
          - "3.10"
          - "3.11"
          - "3.12"
          - "3.13"

    steps:
      - name: Check out repository
        uses: actions/checkout@v5

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip

      - name: Show Python version
        run: python --version

      - name: Upgrade pip
        run: python -m pip install --upgrade pip

      - name: Install Weather CLI development dependencies
        run: python -m pip install -e ".[dev]"

      - name: Run test suite
        run: pytest -v


  quality:
    name: Code Quality
    runs-on: ubuntu-latest

    steps:
      - name: Check out repository
        uses: actions/checkout@v5

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: "3.12"
          cache: pip

      - name: Show Python version
        run: python --version

      - name: Upgrade pip
        run: python -m pip install --upgrade pip

      - name: Install Weather CLI development dependencies
        run: python -m pip install -e ".[dev]"

      - name: Run Ruff lint checks
        run: python -m ruff check .

      - name: Check Ruff formatting
        run: python -m ruff format --check .

      - name: Run tests with coverage
        run: pytest --cov=weather_cli --cov-report=term-missing


  package:
    name: Package
    runs-on: ubuntu-latest

    steps:
      - name: Check out repository
        uses: actions/checkout@v5

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: "3.12"
          cache: pip

      - name: Show Python version
        run: python --version

      - name: Upgrade pip
        run: python -m pip install --upgrade pip

      - name: Install packaging tools
        run: python -m pip install build twine

      - name: Build wheel and source distribution
        run: python -m build

      - name: Validate distributions
        run: python -m twine check dist/*

      - name: Show distribution files
        run: ls -lah dist

      - name: Install built wheel
        shell: bash
        run: |
          python -m pip install dist/*.whl

      - name: Verify installed package metadata
        run: python -m pip show weather-cli

      - name: Verify CLI version
        run: weather --version

      - name: Verify CLI help
        run: weather --help

      - name: Upload distribution artifacts
        uses: actions/upload-artifact@v4
        with:
          name: weather-cli-distributions
          path: |
            dist/*.whl
            dist/*.tar.gz
          if-no-files-found: error