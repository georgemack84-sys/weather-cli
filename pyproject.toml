[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"


[project]
name = "weather-cli"
version = "0.2.0.dev0"
description = "A command-line weather application powered by Open-Meteo"
readme = "README.md"
requires-python = ">=3.10"
license = { text = "MIT" }

authors = [
    { name = "George Mack" },
]

keywords = [
    "weather",
    "cli",
    "terminal",
    "open-meteo",
    "forecast",
]

classifiers = [
    "Development Status :: 3 - Alpha",
    "Environment :: Console",
    "Intended Audience :: End Users/Desktop",
    "License :: OSI Approved :: MIT License",
    "Operating System :: OS Independent",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Topic :: Utilities",
]

dependencies = [
    "requests>=2.31.0",
    "rich>=13.0",
]


[project.optional-dependencies]
dev = [
    "build>=1.2.0",
    "pytest>=8.0",
    "pytest-cov>=5.0",
    "ruff==0.12.11",
]


[project.scripts]
weather = "weather_cli.cli:main"


[project.urls]
Homepage = "https://github.com/georgemack84-sys/weather-cli"
Repository = "https://github.com/georgemack84-sys/weather-cli"
Issues = "https://github.com/georgemack84-sys/weather-cli/issues"


[tool.setuptools.packages.find]
where = ["."]
include = ["weather_cli*"]


[tool.pytest.ini_options]
testpaths = [
    "tests",
]

addopts = [
    "-ra",
]


[tool.ruff]
target-version = "py310"
line-length = 88

exclude = [
    ".git",
    ".github",
    ".venv",
    ".pytest_cache",
    ".ruff_cache",
    "__pycache__",
    "build",
    "dist",
]


[tool.ruff.lint]
select = [
    "E",
    "F",
    "I",
    "UP",
]

ignore = []


[tool.ruff.format]
quote-style = "double"
indent-style = "space"
line-ending = "auto"


[tool.coverage.run]
source = [
    "weather_cli",
]

branch = true


[tool.coverage.report]
show_missing = true
skip_covered = false
precision = 1
fail_under = 100

exclude_lines = [
    "pragma: no cover",
    "if __name__ == .__main__.:",
]