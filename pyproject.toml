[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"


[project]
name = "weather-cli"
version = "0.1.0"
description = "A command-line weather application powered by Open-Meteo"
readme = "README.md"
requires-python = ">=3.10"

dependencies = [
    "requests>=2.31.0",
    "rich>=13.0",
]


[project.optional-dependencies]
dev = [
    "pytest>=8.0",
    "pytest-cov>=5.0",
    "ruff==0.12.11",
]


[project.scripts]
weather = "weather_cli.cli:main"


[tool.setuptools.packages.find]
where = ["."]
include = ["weather_cli*"]


[tool.pytest.ini_options]
testpaths = [
    "tests",
]

addopts = [
    "-ra",
]


[tool.ruff]
target-version = "py310"
line-length = 88

exclude = [
    ".git",
    ".github",
    ".venv",
    ".pytest_cache",
    ".ruff_cache",
    "__pycache__",
    "build",
    "dist",
]


[tool.ruff.lint]
select = [
    "E",
    "F",
    "I",
    "UP",
]

ignore = []


[tool.ruff.format]
quote-style = "double"
indent-style = "space"
line-ending = "auto"


[tool.coverage.run]
source = [
    "weather_cli",
]

branch = true


[tool.coverage.report]
show_missing = true
skip_covered = false
precision = 1

# Keep this at 40 until the current codebase is green in GitHub CI.
# Once CI is fully green, raise this to 100.
fail_under = 40

exclude_lines = [
    "pragma: no cover",
    "if __name__ == .__main__.:",
]